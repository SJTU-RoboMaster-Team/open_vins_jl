%YAML:1.0
# Legacy folder name: this config drives a stereo pair on x500_mono_cam.
verbosity: "DEBUG"
use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false
max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1
gravity_mag: 9.81
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"
try_zupt: true
# Keep the statistical gate active during hover. A zero multiplier makes the
# gate threshold zero, so any non-zero residual is rejected unless the
# disparity shortcut happens to pass on that frame.
zupt_chi2_multipler: 5
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
# ZUPT is only valid for the pre-flight ground hold. During flight the
# estimated velocity can briefly fall below the threshold while image
# disparity is still non-zero; applying a zero-velocity update then corrupts
# the moving trajectory and can cause eventual visual lock loss.
zupt_only_at_beginning: true
init_window_time: 2.0
init_imu_thresh: 1.0
# Static initialization requires a positive maximum image disparity while the
# vehicle is stationary on the ground.
init_max_disparity: 0.5
init_max_features: 100
# The flight controller waits for a stationary, initialized VIO before
# takeoff. Dynamic initialization needs deliberate attitude excitation and
# must not be used with the ground-hold startup sequence.
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.5
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 15.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-15
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]
record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
multi_threading_pubs: false
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"
use_klt: true
use_aruco: true
num_aruco: 0
downsize_aruco: false
# The full 1280x960 stereo stream overruns the estimator on the simulator
# host. OpenVINS scales the images and intrinsics consistently when enabled.
downsample_cameras: true
histogram_method: "HISTOGRAM"
track_frequency: 20.0
num_pts: 250
fast_threshold: 12
grid_x: 20
grid_y: 20
min_px_dist: 15
knn_ratio: 0.85
downsample_aruco: false
num_opencv_threads: 0
use_multipoint_northstar: false
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1
use_mask: false
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
